[project]
name = "bo-universe-semantic-extractor"
version = "0.1.0"
description = "Extract and normalize semantic metadata from SAP BusinessObjects universes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
bo-extract = "bo_semantic_extractor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
